name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pandoc and Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Install Typst
        run: pip install --break-system-packages typst

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Validate section files
        run: python scripts/validate_sections.py

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Check complete-book readiness
        id: readiness
        run: |
          slugs="printcrime when-sysadmins-ruled-the-earth andas-game i-robot i-row-boat after-the-siege"
          ready=true
          not_ready_count=0
          for slug in $slugs; do
            f="docs/ja/${slug}.md"
            if [ ! -f "$f" ]; then
              ready=false
              not_ready_count=$((not_ready_count + 1))
              continue
            fi
            if ! grep -qE '^translation_status:[[:space:]]*(reviewed|final)[[:space:]]*$' "$f"; then
              ready=false
              not_ready_count=$((not_ready_count + 1))
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "::notice::Complete-book build skipped — $not_ready_count of 6 stories are not yet present with translation_status: reviewed or final."
          fi

      - name: Build EPUB and PDF (complete book — all 6 stories reviewed/final)
        if: steps.readiness.outputs.ready == 'true'
        run: npm run book:all

      - name: Verify book outputs exist
        if: steps.readiness.outputs.ready == 'true'
        run: |
          test -s docs/public/downloads/overclocked-ja.epub
          test -s docs/public/downloads/overclocked-ja.pdf
          file docs/public/downloads/overclocked-ja.epub
          file docs/public/downloads/overclocked-ja.pdf

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
